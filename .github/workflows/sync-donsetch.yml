name: Sync donsetch tools

on:
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install donsetch and test packages
              run: npm install --no-save @earendil-works/pi-mcp@1.1.0 @earendil-works/pi-ai@1.1.0 @earendil-works/pi-durable@1.1.0 donsetch@latest

            - name: Generate the static tools
              env:
                  DONSETCH_BINARY: ${{ github.workspace }}/node_modules/donsetch/binaries/donsetch
              run: node scripts/generate-tools.mjs

            - name: Check for changes
              id: changes
              run: |
                  if git diff --quiet -- donsetch.ts tools.lock.json; then
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check the module
              if: steps.changes.outputs.changed == 'true'
              env:
                  DONSETCH_BINARY: ${{ github.workspace }}/node_modules/donsetch/binaries/donsetch
              run: node scripts/check-module.mjs

            - name: Bump the addon version
              if: steps.changes.outputs.changed == 'true'
              run: npm version patch --no-git-tag-version --force

            - name: Push the sync branch
              if: steps.changes.outputs.changed == 'true'
              run: |
                  version="$(node -p "require('./tools.lock.json').donsetch")"
                  branch="sync/donsetch-tools"

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -B "$branch"
                  git add donsetch.ts tools.lock.json package.json
                  git commit -m "Sync donsetch tools to ${version}"
                  git push --force origin "$branch"

                  {
                    echo "Automated tool sync with donsetch ${version}."
                    echo
                    echo "This PR updates the static tool block and tools.lock.json from the latest npm release. Review the tool names, descriptions, schemas, and read-only flags before merging."
                    echo
                    echo "AI-generated notice: An AI assistant generated this workflow and its text. Review the diff before merging."
                  } > /tmp/sync-body.md

            - name: Open or update a pull request
              if: steps.changes.outputs.changed == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  branch="sync/donsetch-tools"
                  version="$(node -p "require('./tools.lock.json').donsetch")"
                  existing="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number')"

                  if [ -n "$existing" ]; then
                    echo "The sync PR is open: #$existing"
                    gh pr edit "$existing" --title "Sync donsetch tools to ${version}" --body-file /tmp/sync-body.md
                    exit 0
                  fi

                  gh pr create --head "$branch" --title "Sync donsetch tools to ${version}" --body-file /tmp/sync-body.md
